name: Test maturin before-script-linux input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run maturin action with before-script-linux
        id: action
        uses: .
        with:
          command: completions
          args: bash
          manylinux: 'off'
          before-script-linux: |
            echo "Before script running on Linux"
            touch /tmp/before-script-ran

      - name: Verify before-script ran
        run: |
          echo "Checking that before-script-linux ran..."
          if [ ! -f /tmp/before-script-ran ]; then
            echo "FAIL: /tmp/before-script-ran not found — before-script-linux did not run"
            exit 1
          fi
          echo "PASS: before-script-linux ran successfully"
