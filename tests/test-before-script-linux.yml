name: Test maturin with before-script-linux input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: build
          args: --help
          before-script-linux: 'echo "before-script-linux ran"'
      - name: Assert action ran with before-script-linux input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: maturin ran with before-script-linux set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected in some CI environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
