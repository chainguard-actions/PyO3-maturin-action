name: Test before-script-linux input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: build
          args: --help
          manylinux: 'off'
          before-script-linux: echo "before script ran"
      - name: Assert action completed
        run: |
          echo "PASS: action ran with before-script-linux input"
