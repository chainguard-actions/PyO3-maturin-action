name: Test maturin with docker and linux script options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: 'build'
          args: '--help'
          container: 'ghcr.io/pyo3/maturin'
          docker-options: '-e SOME_VAR=value'
          host-home-mount: '/root'
          before-script-linux: 'echo "before script ran"'
      - name: Assert action completed
        run: |
          echo "PASS: action completed with docker and linux script options"
