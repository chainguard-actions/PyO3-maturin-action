name: Test maturin container, docker-options, and host-home-mount inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run maturin action with container, docker-options, and host-home-mount inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          command: completions
          args: bash
          container: 'ghcr.io/pyo3/maturin:latest'
          docker-options: '-e MATURIN_TEST=1'
          host-home-mount: '/root'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with container, docker-options, and host-home-mount inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker container may not be available under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
