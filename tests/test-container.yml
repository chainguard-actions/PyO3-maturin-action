name: Test maturin with container, docker-options, and host-home-mount inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: build
          args: --help
          container: ghcr.io/pyo3/maturin:latest
          docker-options: '-e MATURIN_TEST=1'
          host-home-mount: /root
      - name: Assert action ran with container, docker-options, and host-home-mount inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: maturin ran with container, docker-options, and host-home-mount set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected in some CI environments with Docker-in-Docker)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
