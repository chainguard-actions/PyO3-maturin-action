name: Test maturin latest version installation
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run maturin-action with latest version
        id: action
        uses: .
        with:
          command: build
          args: --help
          maturin-version: 'latest'
          manylinux: 'off'

      - name: Verify maturin latest is installed
        run: |
          echo "Checking maturin is installed..."
          if ! command -v maturin &>/dev/null; then
            echo "FAIL: maturin not found on PATH"
            exit 1
          fi
          VERSION=$(maturin --version 2>&1 || true)
          echo "actual: $VERSION"
          if echo "$VERSION" | grep -qE "maturin [0-9]+\.[0-9]+\.[0-9]+"; then
            echo "PASS: maturin latest is installed: $VERSION"
          else
            echo "FAIL: unexpected maturin version output: $VERSION"
            exit 1
          fi
