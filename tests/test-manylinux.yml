name: Test maturin with manylinux and rust toolchain options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: 'build'
          args: '--help'
          manylinux: 'auto'
          target: 'x86_64-unknown-linux-gnu'
          rust-toolchain: 'stable'
          rustup-components: 'rustfmt'
      - name: Assert action completed
        run: |
          echo "PASS: action completed with manylinux and rust toolchain options"
