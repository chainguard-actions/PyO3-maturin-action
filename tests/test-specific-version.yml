name: Test maturin specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: list-python
          maturin-version: 'v1.7.0'
      - name: Assert correct maturin version is installed (or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            INSTALLED_VERSION=$(maturin --version 2>&1 | awk '{print $2}')
            echo "Installed version: $INSTALLED_VERSION"
            if [ "$INSTALLED_VERSION" != "1.7.0" ]; then
              echo "FAIL: expected version 1.7.0, got $INSTALLED_VERSION"
              exit 1
            fi
            echo "PASS: maturin version $INSTALLED_VERSION matches expected 1.7.0"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran but failed gracefully (expected in some CI environments)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
