name: Test basic maturin installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run maturin action with completions command
        id: action
        uses: .
        with:
          command: completions
          args: bash
          manylinux: 'off'

      - name: Verify maturin was installed and ran
        run: |
          echo "Checking maturin is available on PATH..."
          if ! command -v maturin &>/dev/null; then
            echo "FAIL: maturin not found on PATH after action ran"
            exit 1
          fi
          echo "PASS: maturin is available at $(command -v maturin)"
          maturin --version
