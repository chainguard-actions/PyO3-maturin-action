name: Test maturin build command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal Rust/Python project fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/myproject/src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/myproject/Cargo.toml" << 'EOF'
          [package]
          name = "myproject"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "myproject"
          crate-type = ["cdylib"]

          [dependencies]
          pyo3 = { version = "0.22", features = ["extension-module"] }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/myproject/src/lib.rs" << 'EOF'
          use pyo3::prelude::*;

          #[pyfunction]
          fn hello() -> &'static str {
              "hello from rust"
          }

          #[pymodule]
          fn myproject(_py: Python, m: &PyModule) -> PyResult<()> {
              m.add_function(wrap_pyfunction!(hello, m)?)?;
              Ok(())
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/myproject/pyproject.toml" << 'EOF'
          [build-system]
          requires = ["maturin>=1.0,<2.0"]
          build-backend = "maturin"

          [project]
          name = "myproject"
          version = "0.1.0"
          requires-python = ">=3.8"
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          command: build
          args: --release --out dist
          manylinux: 'off'
          working-directory: tests/fixtures/myproject
      - name: Assert build ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: maturin build succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: maturin build ran but failed gracefully (expected without full Rust toolchain)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
