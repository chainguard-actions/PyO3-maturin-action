name: Test maturin version pinning
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run maturin action with pinned version
        id: action
        uses: .
        with:
          command: completions
          args: bash
          maturin-version: 'v1.7.0'
          manylinux: 'off'

      - name: Verify correct maturin version was installed
        run: |
          echo "Checking maturin version..."
          if ! command -v maturin &>/dev/null; then
            echo "FAIL: maturin not found on PATH"
            exit 1
          fi
          INSTALLED_VERSION=$(maturin --version 2>&1)
          echo "Installed version: $INSTALLED_VERSION"
          if echo "$INSTALLED_VERSION" | grep -q "1.7.0"; then
            echo "PASS: maturin v1.7.0 is installed"
          else
            echo "FAIL: expected maturin v1.7.0 but got: $INSTALLED_VERSION"
            exit 1
          fi
