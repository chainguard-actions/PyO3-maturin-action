name: Test container, docker-options, and host-home-mount inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          command: build
          args: --help
          container: ghcr.io/pyo3/maturin:latest
          docker-options: '-e SOME_VAR=value'
          host-home-mount: /root
      - name: Assert action completed
        run: |
          echo "PASS: action ran with container, docker-options, and host-home-mount inputs"
